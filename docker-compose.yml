services:
  db:
    image: postgres:16-alpine
    container_name: aigis_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - aigis_net

  backend:
    build:
      context: ./Backend/Backend
      dockerfile: Dockerfile
    container_name: aigis_backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://0.0.0.0:5298"
      ConnectionStrings__DefaultConnection: "Host=db;Port=5432;Database=${POSTGRES_DB};Username=${POSTGRES_USER};Password=${POSTGRES_PASSWORD}"
      ApiKey: ${API_KEY}
      AutoMigrate: "true"
    ports:
      - "127.0.0.1:5298:5298"
    networks:
      - aigis_net

  bot:
    build:
      context: ./DiscordBot
      dockerfile: Dockerfile
    container_name: aigis_bot
    restart: unless-stopped
    depends_on:
      - backend
      - db
    environment:
      BOT_TOKEN: ${BOT_TOKEN}
      API_BASE_URL: ${API_BASE_URL:-http://backend:5298/api}
      API_KEY: ${API_KEY}
      LLM_API_KEY: ${LLM_API_KEY:-}
    networks:
      - aigis_net

volumes:
  postgres_data:

networks:
  aigis_net:
    driver: bridge